name: Create Release with Artifacts

on:
  push:
    branches: [ main ]

jobs:
  build-and-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for changelog generation

      - name: Build Docker image
        run: docker build -t ff-extractor --secret id=SSH_PRIVATE_KEY --secret id=SSH_PASSPHRASE .
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}

      - name: Copy artifacts from container
        run: |
          container_id=$(docker create ff-extractor)
          docker cp $container_id:/app/artifacts ./artifacts
          docker rm $container_id

      - name: Check changelog and prepare release
        id: prepare_release
        run: |
          # Check if changelog exists and has content
          if [ ! -f "artifacts/changelog.txt" ] || [ ! -s "artifacts/changelog.txt" ]; then
            echo "skip_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get changelog content
          changelog=$(cat artifacts/changelog.txt)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$changelog" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Determine next release number from the latest release tag
          latest_tag=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName // empty')
          if [ -z "$latest_tag" ]; then
            release_number=1
          elif [[ "$latest_tag" =~ ^release-([0-9]+)$ ]]; then
            release_number=$((BASH_REMATCH[1] + 1))
          else
            echo "Could not parse release number from tag: $latest_tag" >&2
            exit 1
          fi
          echo "release_number=$release_number" >> $GITHUB_OUTPUT

          # Format current date
          formatted_date=$(date '+%B %d, %Y %H:%M')
          echo "formatted_date=$formatted_date" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: steps.prepare_release.outputs.skip_release != 'true'
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.prepare_release.outputs.release_number }} (${{ steps.prepare_release.outputs.formatted_date }})
          body: |
            Created on ${{ steps.prepare_release.outputs.formatted_date }}.

            Changelog:
            ${{ steps.prepare_release.outputs.changelog }}
          files: artifacts/*.zip
          tag_name: release-${{ steps.prepare_release.outputs.release_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-csv-files:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker image for uploading CSV files
        # This is kept as a separate step to avoid breaking releases
        # It also checks if release went alright and files are downloadable
        # This will always use whatever's in the latest release, so you can't mess it up, even when ran locally
        # In the event that you or this script does mess it up, or you want to add a new Google Sheets file, do these:
        # 1. For a new file, create a new Google Sheets file in the Google Drive folder.
        #    Otherwise, open the file you want to update.
        # 2. Rename your local CSV file like "item_source_info_table.csv" -> "Item_Source_Info_Table.csv".
        # 3. Import the CSV into the Google Sheets file, replace the existing spreadsheet.
        # 4. If the Google Sheets file is unnamed, rename it to the same name as the worksheet name.
        # 5. Run this action or script again. The script checks per build and per file what it can update,
        #    but doing it per file every time is more straightforward.
        run: docker build -t ff-extractor-upload-csv -f Dockerfile.upload_csv --secret id=GOOGLE_SERVICE_ACCOUNT_JSON .
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

  deploy-exclusion-editor:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: retrobution-exclude-editor/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install web dependencies
        run: npm ci --prefix retrobution-exclude-editor

      - name: Test web application
        run: npm test --prefix retrobution-exclude-editor

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Build unfiltered Retrobution artifact
        run: |
          mkdir -p editor-artifacts
          docker build \
            --file Dockerfile \
            --build-arg FFINFO_FORCED_BUILD=retrobution \
            --build-arg FFINFO_SKIP_FILTERING=1 \
            --tag ffinfo-editor-artifact \
            --secret id=SSH_PRIVATE_KEY \
            --secret id=SSH_PASSPHRASE \
            .

          container_id="$(docker create ffinfo-editor-artifact)"
          revision="$(yq -r '.config.retrobution.revision' config/build-config.yml)"
          docker cp \
            "$container_id:/app/artifacts/retrobution_r${revision}.zip" \
            "editor-artifacts/retrobution_r${revision}_unfiltered.zip"
          docker rm $container_id
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}

      - name: Install catalog encryption dependency
        run: python -m pip install cryptography

      - name: Pack encrypted catalog
        run: |
          artifact="$(find editor-artifacts -name 'retrobution_r*_unfiltered.zip' -print -quit)"
          python scripts/pack_editor_catalog.py \
            "$artifact" \
            retrobution-exclude-editor/public/catalog.enc
        env:
          EDITOR_KEY: ${{ secrets.EDITOR_KEY }}

      - name: Build production site
        run: npm run build --prefix retrobution-exclude-editor

      - name: Check deployment for plaintext catalog data
        run: |
          test -f retrobution-exclude-editor/dist/catalog.enc
          test ! -e retrobution-exclude-editor/dist/icons
          test ! -e retrobution-exclude-editor/dist/info

      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          workingDirectory: retrobution-exclude-editor
